<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватный Матч-Центр</title>
    
    <script>
        // ==========================================
        // НАСТРОЙКИ САЙТА (МЕНЯЙ ТОЛЬКО ЗДЕСЬ):
        // ==========================================
        const SECRET_TOKEN = "football2026"; // Пароль для входа в конце ссылки
        const DONATE_URL = "https://donationalerts.com"; // Твоя ссылка на донаты
        const DEFAULT_STREAM = "https://vk.com"; // Ссылка на трансляцию ВК
        // ==========================================
    </script>

    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        #denied { text-align: center; font-size: 24px; color: #ff4a4a; }
        #app { display: none; width: 95%; max-width: 1300px; margin: 20px; }
        .grid { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .player { position: relative; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #1e293b; }
        .player iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .sidebar { background: #111827; padding: 20px; border-radius: 8px; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 20px; }
        .btn { display: block; background: #22c55e; color: #fff; text-align: center; padding: 15px; border-radius: 6px; font-size: 18px; font-weight: bold; text-decoration: none; }
        .btn:hover { background: #16a34a; }
        .panel input { width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; }
        .panel button { width: 100%; padding: 10px; background: #3b82f6; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .panel button:hover { background: #2563eb; }
        h2 { margin-top: 0; font-size: 18px; color: #3b82f6; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Заглушка 404 (показывается всем врагам) -->
    <div id="denied">
        <h1>404 Not Found</h1>
        <p>Страница не существует или доступ ограничен.</p>
    </div>

    <!-- Основной интерфейс (показывается только тебе) -->
    <div id="app">
        <h1 style="font-size: 20px; margin-bottom: 20px; color: #3b82f6;">🔴 PRIVATE VIP STREAM STATION</h1>
        <div class="grid">
            <div class="player">
                <iframe id="main-player" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="sidebar">
                <div class="panel">
                    <h2>💰 ПОДДЕРЖКА</h2>
                    <a id="donate-link" href="#" target="_blank" class="btn">ОТПРАВИТЬ ДОНАТ</a>
                </div>
                <div class="panel">
                    <h2>🔄 СМЕНА ТРАНСЛЯЦИИ</h2>
                    <input type="text" id="new-url" placeholder="Вставь src ссылку из ВК">
                    <button onclick="changeStream()">ОБНОВИТЬ ПОТОР</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Проверка секретного токена при входе
        const params = new URLSearchParams(window.location.search);
        if (params.get('token') === SECRET_TOKEN) {
            document.getElementById('denied').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('main-player').src = DEFAULT_STREAM;
            document.getElementById('donate-link').href = DONATE_URL;
        }

        // Функция быстрой смены ссылки кнопкой
        function changeStream() {
            const inputUrl = document.getElementById('new-url').value;
            if (inputUrl) {
                document.getElementById('main-player').src = inputUrl;
            } else {
                alert("Пожалуйста, вставь рабочую ссылку!");
            }
        }
    </script>
</body>
</html>
